<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Bible Quest: The Lost Clues · Tour 1</title>
<style>
:root{--ink:#35261c;--gold:#a56c27;--paper:#fff8e8;--cream:#f4e7cc;--night:#1b2b38;--green:#328675;--border:#c7a371}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#526c77,#1b2830 74%);font-family:system-ui,-apple-system,'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#fcf6eb;min-height:100vh}
button{cursor:pointer;font:inherit}button:focus-visible{outline:3px solid #6de5c2;outline-offset:3px}
.shell{max-width:1180px;margin:auto;padding:18px 16px 44px}
header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:8px 0 15px}
.topline{font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:#dbc38e;font-weight:700}
h1{font-family:Georgia,'Noto Serif TC',serif;font-size:clamp(23px,3.2vw,38px);line-height:1.2;margin:3px 0;color:#fff1ce}
.subtitle{font-size:14px;color:#ced9d6;margin:0}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tool{border:1px solid #9d916c;color:white;background:#293d46;border-radius:10px;padding:10px 12px;min-height:44px}
.tool.active{background:#f0d495;color:#2d2520;font-weight:800}.tool:hover{filter:brightness(1.14)}
.map-frame{border:7px solid #8f672f;box-shadow:0 18px 45px #0007; border-radius:16px;overflow:hidden;background:#1a282c;position:relative}
.map-wrap{position:relative;aspect-ratio:1672/941;width:100%;overflow:hidden}
.map-art{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.map-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#1219133d,transparent 22%);pointer-events:none}
.marker{position:absolute;transform:translate(-50%,-50%);width:clamp(34px,4.2vw,58px);height:clamp(34px,4.2vw,58px);border-radius:50%;z-index:3;display:grid;place-items:center;border:3px solid #fff0b8;background:radial-gradient(circle,#d5a044,#8b4f17);color:#fff;font-size:clamp(15px,2.1vw,25px);font-weight:900;box-shadow:0 0 0 5px #3b240f7a,0 0 22px #ffd36a99;transition:transform .15s}
.marker:hover:not([disabled]){transform:translate(-50%,-50%) scale(1.16)}
.marker[disabled]{cursor:not-allowed;background:#3e4449;border-color:#bab5a7;box-shadow:0 0 0 4px #28272a78;color:#c5c8c9}
.marker.done{background:radial-gradient(circle,#9cdbab,#2b785c);border-color:#e5ffd6}.marker.current{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 5px #3b240f7a,0 0 15px #ffd36a}50%{box-shadow:0 0 0 9px #e2b65e77,0 0 33px #ffd36a}}
.map-hint{position:absolute;left:16px;bottom:13px;z-index:4;max-width:65%;border-radius:12px;background:#1e2929dc;border:1px solid #ffffff55;padding:8px 12px;font-size:clamp(11px,1.3vw,14px);color:#fff8e6}
.progress-line{display:flex;gap:8px;margin:16px 0 20px}.progress-line>span{height:6px;border-radius:3px;background:#566367;flex:1}.progress-line>span.on{background:#f8d07a}
.layout{display:grid;grid-template-columns:minmax(230px,320px) 1fr;gap:18px;align-items:start}
.panel{background:var(--paper);color:var(--ink);border:3px solid var(--border);border-radius:17px;box-shadow:0 12px 28px #0003;overflow:hidden}
.panel-head{background:linear-gradient(110deg,#e1c28a,#f9eccd);padding:16px 18px;border-bottom:2px solid #d0ac72}
.panel-head h2{font:700 23px Georgia,'Noto Serif TC',serif;margin:4px 0}.panel-head p{margin:3px 0;font-size:14px;line-height:1.55}
.timeline{list-style:none;margin:0;padding:10px}.timeline button{width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;display:flex;gap:10px;align-items:center;padding:11px 10px;color:#3d3225}
.timeline button:hover:not([disabled]){background:#efdfbf}.timeline button[disabled]{opacity:.58;cursor:default}.timeline .stepno{flex:0 0 30px;height:30px;display:grid;place-items:center;border-radius:50%;color:white;background:#9c753d;font-weight:800}
.timeline .done .stepno{background:#408c6f}.timeline .active{background:#efdfbf;border-color:#ccaa69}.timeline .title{font-weight:800;font-size:14px}.timeline .sub{font-size:12px;color:#71624f}.timeline .txt{display:grid;gap:2px}
.mission{min-height:340px}.mission-content{padding:18px}.mission h3{margin:0 0 8px;font-size:20px}.mission p{line-height:1.65;margin:7px 0 12px;color:#584b3b}.mission .small{font-size:13px;color:#6b5d4a}
.info-pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;background:#f0e1c8;padding:5px 10px;color:#73512a}
.divider{height:1px;background:#ddc8a8;margin:15px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.btn{border:2px solid #936e37;background:linear-gradient(#f4d58f,#ce9b4f);color:#3b2710;border-radius:12px;padding:10px 16px;font-weight:800;min-height:44px}.btn.secondary{background:#fff8e8;border-color:#d5bd91}.btn:hover{filter:brightness(1.04)}
.board{background:linear-gradient(135deg,#e7d3ac,#f8edda);padding:15px;border:2px solid #c2a476;border-radius:13px;margin-top:12px;position:relative;overflow:hidden;min-height:190px}
.search-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:repeating-linear-gradient(135deg,#e0bd8c,#e0bd8c 16px,#e6c99f 17px,#e6c99f 31px);border:3px solid #ad8658;border-radius:10px;padding:12px;min-height:225px}.search-item{display:grid;place-items:center;font-size:clamp(23px,3vw,38px);background:#f7dfafbb;border:2px solid #a78052;border-radius:12px;min-height:55px;cursor:pointer}.search-item:hover{transform:scale(1.04)}.search-item.found{background:#b2e2b6;border-color:#458c5f}.search-item.decoy{opacity:.7}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.food-list,.animal-list{display:grid;gap:10px}.tile{background:#fff9e8;border:2px solid #ba9565;min-height:62px;padding:9px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;color:#5d4529}.tile .emoji{font-size:28px}.tile.selected{outline:4px solid #41a887}.tile.used,.tile.matched{background:#cbead3;border-color:#63a778}.tile[draggable=true]{cursor:grab}.animal{border-style:dashed;cursor:pointer}
.level-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.level-card{display:grid;place-items:center;gap:5px;padding:15px 8px;min-height:95px;border:2px solid #b38a52;border-radius:12px;background:linear-gradient(#c7e1e6,#92bdd0);font-weight:700;cursor:grab}.level-card .water{font-size:28px}.level-card.selected{outline:4px solid #4eaab0}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.slot{background:#f5e0b7;min-height:90px;border:2px dashed #b68c56;border-radius:12px;padding:9px;text-align:center;cursor:pointer;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}.slot.assigned{background:#e2edcf}.slot .big{font-size:25px}
.order-bank{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.order-card{border:2px solid #bf995b;background:#fff5df;border-radius:10px;padding:10px;min-height:75px;text-align:center;display:grid;place-items:center;font-size:14px;cursor:pointer}.order-card.selected{outline:4px solid #44a69b}.order-card.used{opacity:.35}.order-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.order-slot{min-height:98px;border:2px dashed #bf995b;background:#ebd7ae;border-radius:10px;text-align:center;padding:5px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:5px;font-size:13px}.order-slot b{display:block;color:#83602d}
.path-board{height:260px;background:linear-gradient(140deg,#c2d9a7,#b3c49a 30%,#8fb6a0 52%,#c6d69e 70%,#9db48c);border:3px solid #8eaa84;border-radius:15px;position:relative;touch-action:none;margin-top:12px;overflow:hidden}.path-board::before{content:'';position:absolute;inset:-25px 35% 0;transform:rotate(30deg);background:#62a9bcb8;filter:blur(11px)}.path-board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.stone{position:absolute;transform:translate(-50%,-50%);height:54px;width:54px;display:grid;place-items:center;border-radius:48% 54% 45% 58%;background:linear-gradient(#ede4cf,#a69c83);border:3px solid #7c795f;color:#615746;box-shadow:3px 5px 0 #6766516e;font-size:20px;font-weight:900;cursor:pointer;user-select:none;touch-action:none}.stone.hit{background:linear-gradient(#ffecb0,#d5a34f);border-color:#916427;color:#522f09}.path-board.dragging .stone{cursor:crosshair}
.reward{border:2px solid #c99e4d;border-radius:15px;background:linear-gradient(145deg,#fff3cd,#e6d5a8);padding:22px;text-align:center;margin:14px 0}.reward .big-icon{font-size:58px;filter:drop-shadow(0 4px 3px #aa834b)}.reward h3{font-size:24px}
.notice{margin-top:12px;font-size:13px;color:#e1dccf;line-height:1.7}.status{margin-top:10px;min-height:20px;font-size:13px;font-weight:700;color:#287d62}.status.error{color:#a53e35}
@media(max-width:760px){.layout{grid-template-columns:1fr}.panel.mission{order:1}.panel.sidebar{order:2}.marker{border-width:2px}.map-hint{max-width:85%;left:8px;bottom:7px;padding:5px 8px}.mission-content{padding:14px}.order-slots{grid-template-columns:repeat(2,1fr)}.order-slot{min-height:85px}.stone{width:49px;height:49px}.search-grid{gap:5px;padding:7px;min-height:180px}.search-item{min-height:45px}}
@media(max-width:460px){.map-frame{border-width:4px}.marker{width:29px;height:29px;font-size:13px}.map-hint{font-size:10px}.match-grid{gap:8px}.tile{min-height:59px;padding:5px;font-size:12px}.tile .emoji{font-size:22px}.order-bank{grid-template-columns:1fr 1fr}.order-card{padding:5px;font-size:12px}.level-card{padding:7px 3px}}

 missionIntro:['Find three tools hidden among the objects on deck to prepare for observation.','Give each of the three animals the right food. Drag food onto an animal, or tap food then tap an animal.','Arrange three water-level stones from highest to lowest to show the receding flood.','In Genesis 8, what happened when the raven and dove were sent out? Arrange the four events in the correct sequence.','Begin with stone 1 at the lower-left and follow the route across five stones. Drag across them or tap in order.'],

 rewards:['Deck Ready','Animal Care Complete','Water Records Restored','The Olive Leaf Message','Rainbow Covenant: A New Beginning'],rewardText:['The ark rested on the mountains of Ararat while the floodwaters slowly receded.','You completed a fictional animal-care task as preparation for the next episode.','The floodwater slowly receded. Remember the importance of waiting rather than leaving too soon.','The returning dove carried an olive leaf, showing that the waters had receded. Noah still waited for the ground to dry.','In Genesis 9, the rainbow is the sign of God’s covenant. Congratulations on completing Tour One!'],
 items:['🪢','🪣','🏮'],found:'Found',progress:'Found',of:' / ',
 animalNames:['Sheep','Giraffe','Elephant'],foodNames:['Hay','Leaves','Fruit'],
 levelNames:['High Water','Medium Water','Low Water'],slotNames:['First','Then','Finally'],
 events:['The raven is sent out','The dove returns with no resting place','The dove returns with an olive leaf','The dove does not return'],
 slotsText:'Event',pathFinish:'Follow the route',finalTitle:'Tour One Complete!',finalText:'You have completed all five challenges aboard Noah’s Ark. The next tour will follow the biblical chronology—without time travel.',sourceList:['Genesis 8:4–5','Genesis 6:19–21 (care puzzle is fictional)','Genesis 8:3–5','Genesis 8:6–12','Genesis 8:13–19; 9:12–17']}
};
const positions=[[26,55],[39,47],[56,41],[67,22],[82,64]];
const saveKey='biblequest-ark-tour1-v1';
let saved;try{saved=JSON.parse(localStorage.getItem(saveKey)||'null')}catch(e){}
const S={lang:(saved&&saved.lang==='en')?'en':'zh',completed:Math.max(0,Math.min(5,saved?.completed||0)),active:Math.min(4,saved?.completed||0),temp:{},selectedFood:null,selectedLevel:null,selectedEvent:null,dragging:false};
function t(){return L[S.lang]};
function save(){try{localStorage.setItem(saveKey,JSON.stringify({lang:S.lang,completed:S.completed}))}catch(e){}}
function makeTemp(stage){if(stage===0)return {found:[]};if(stage===1)return {matches:[]};if(stage===2)return {levels:[null,null,null]};if(stage===3)return {events:[null,null,null,null]};return {pathCount:0}}
function currentTemp(){return S.temp[S.active] ||= makeTemp(S.active)}
function el(id){return document.getElementById(id)}
function setText(id,content){el(id).textContent=content}
function showStatus(txt,bad=false){let s=el('status');if(s){s.textContent=txt;s.className='status'+(bad?' error':'')}}
function updateAll(){document.documentElement.lang=S.lang==='zh'?'zh-Hant':'en';const x=t();setText('pageTitle',x.title);setText('subTitle',x.sub);setText('resetBtn',x.reset);setText('sideTitle',x.side);setText('sideDesc',x.sideDesc);setText('mapHint',x.mapHint);setText('notice',x.footer);
 el('zhBtn').classList.toggle('active',S.lang==='zh');el('enBtn').classList.toggle('active',S.lang==='en');
 el('markers').innerHTML=positions.map(([left,top],i)=>`<button class="marker ${i<S.completed?'done':i===S.completed?'current':''}" style="left:${left}%;top:${top}%" data-stage="${i}" title="${x.names[i]}" aria-label="${x.names[i]}" ${i>S.completed?'disabled':''}>${i<S.completed?'✓':i>S.completed?'🔒':i+1}</button>`).join('');
 el('progress').innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<S.completed?'on':''}"></span>`).join('');
 el('timeline').innerHTML=x.names.map((name,i)=>`<li><button data-stage="${i}" class="${i<S.completed?'done':''} ${i===S.active?'active':''}" ${i>S.completed?'disabled':''}><span class="stepno">${i<S.completed?'✓':i+1}</span><span class="txt"><span class="title">${name}</span><span class="sub">${i>S.completed?x.locked:x.desc[i]}</span></span></button></li>`).join('');
 setText('missionHead',S.completed===5 && S.active===4?x.finalTitle:x.missionHead[S.active]);setText('missionIntro',x.missionIntro[S.active]);renderPuzzle();
 document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{let n=Number(b.dataset.stage);if(n>S.completed)return;S.active=n;updateAll();if(innerWidth<760)el('puzzle').scrollIntoView({behavior:'smooth',block:'start'})})}
function puzzleIntro(){return `<span class="info-pill">${t().source}：${t().sourceList[S.active]}</span><div class="divider"></div><h3>${t().missionHead[S.active]}</h3><p>${t().missionIntro[S.active]}</p>`}
function toolButtons(){return `<div class="actions"><button class="btn secondary" data-what="hint">💡 ${t().hints}</button><button class="btn secondary" data-what="resetPuzzle">↻ ${t().restart}</button></div><div id="status" class="status"></div>`}
function renderPuzzle(){const i=S.active;const x=t();if(i<S.completed){el('puzzle').innerHTML=rewardHtml(i,true);wireGeneral();return}
 if(S.completed>=5){el('puzzle').innerHTML=rewardHtml(4,true);wireGeneral();return}
 let content=puzzleIntro();let p=currentTemp();
 if(i===0){const icons=['📦','🪢','🪵','🧰','🏺','🪣','🧱','📜','🧺','🏮','🪶','🛢️','🪚','🔩','🔑','🧹','⛓️','⚓','🛠️','🪜'];content+=`<div class="board"><div class="search-grid">${icons.map((ic,k)=>`<button class="search-item ${p.found.includes(k)?'found':''}" data-search="${k}" aria-label="${ic}">${p.found.includes(k)?'✓':ic}</button>`).join('')}</div><p class="small">${x.progress}: ${p.found.length} ${x.of} 3 · ${x.items.join(' ')}</p></div>`}
 if(i===1){const foods=[{ic:'🍎',id:2},{ic:'🌿',id:1},{ic:'🌾',id:0}];const animals=[{ic:'🐘',id:2},{ic:'🐑',id:0},{ic:'🦒',id:1}];content+=`<div class="board"><div class="match-grid"><div class="food-list">${foods.map(v=>`<button class="tile ${S.selectedFood===v.id?'selected':''} ${p.matches.includes(v.id)?'used':''}" draggable="${!p.matches.includes(v.id)}" data-food="${v.id}" ${p.matches.includes(v.id)?'disabled':''}><span class="emoji">${v.ic}</span>${x.foodNames[v.id]}</button>`).join('')}</div><div class="animal-list">${animals.map(v=>`<button class="tile animal ${p.matches.includes(v.id)?'matched':''}" data-animal="${v.id}"><span class="emoji">${v.ic}</span>${x.animalNames[v.id]} ${p.matches.includes(v.id)?'✓':''}</button>`).join('')}</div></div></div><p class="small">${x.instructions}</p>`}
 if(i===2){let nums=[2,0,1],water=['🌊🌊🌊','🌊🌊','🌊'];content+=`<div class="board"><div class="level-cards">${nums.map(id=>`<button draggable="true" data-level="${id}" class="level-card ${S.selectedLevel===id?'selected':''}"><span class="water">${water[id]}</span>${x.levelNames[id]}</button>`).join('')}</div><div class="slots">${p.levels.map((id,k)=>`<button data-level-slot="${k}" class="slot ${id!==null?'assigned':''}"><span>${x.slotNames[k]}</span><span class="big">${id!==null?water[id]:'⬚'}</span>${id!==null?x.levelNames[id]:''}</button>`).join('')}</div></div><p class="small">${x.instructions}</p>`}
 if(i===3){const arr=[2,0,3,1];content+=`<div class="board"><div class="order-bank">${arr.map(id=>`<button draggable="true" data-event="${id}" class="order-card ${S.selectedEvent===id?'selected':''} ${p.events.includes(id)?'used':''}">${x.events[id]}</button>`).join('')}</div><div class="order-slots">${p.events.map((id,k)=>`<button data-event-slot="${k}" class="order-slot"><b>${x.slotsText} ${k+1}</b>${id===null?'＋':x.events[id]}</button>`).join('')}</div></div><p class="small">${x.instructions}</p>`}
 if(i===4){let coords=[[14,79],[31,55],[50,72],[68,39],[85,24]];content+=`<div class="path-board" id="pathBoard"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="14,79 31,55 50,72 68,39 85,24" stroke="#fff6c0" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 3"/></svg>${coords.map(([left,top],k)=>`<span class="stone ${k<p.pathCount?'hit':''}" data-stone="${k}" style="left:${left}%;top:${top}%">${k<p.pathCount?'✓':k+1}</span>`).join('')}</div><p class="small">${x.pathFinish}: ${p.pathCount} ${x.of} 5</p>`}
 content+=toolButtons();el('puzzle').innerHTML=content;wireGeneral();
 if(i===4)wirePath();if(i===1||i===2||i===3)wireDragging();}
function wireGeneral(){el('puzzle').onclick=(ev)=>{let b=ev.target.closest('button');if(!b)return;let x=t();if(b.dataset.what==='hint'){showStatus(x.hintText[S.active]);return}if(b.dataset.what==='resetPuzzle'){S.temp[S.active]=makeTemp(S.active);S.selectedFood=null;S.selectedLevel=null;S.selectedEvent=null;renderPuzzle();return}if(b.dataset.what==='next'){S.active=Math.min(4,S.completed);updateAll();return}
 const i=S.active,p=currentTemp();if(i===0 && b.dataset.search!==undefined){const k=+b.dataset.search;if([1,5,9].includes(k)&&!p.found.includes(k)){p.found.push(k);if(p.found.length===3){finishStage(i);return}renderPuzzle();showStatus(x.found+' ✓')}else if(![1,5,9].includes(k))showStatus('🔎 '+x.hintText[0]);return}
 if(i===1){if(b.dataset.food!==undefined){let n=+b.dataset.food;if(!p.matches.includes(n)){S.selectedFood=n;renderPuzzle()}return}if(b.dataset.animal!==undefined){let n=+b.dataset.animal;if(S.selectedFood===null){showStatus(x.instructions);return}assignFood(S.selectedFood,n);return}}
 if(i===2){if(b.dataset.level!==undefined){S.selectedLevel=+b.dataset.level;renderPuzzle();return}if(b.dataset.levelSlot!==undefined){if(S.selectedLevel!==null)assignLevel(+b.dataset.levelSlot,S.selectedLevel);return}}
 if(i===3){if(b.dataset.event!==undefined){let n=+b.dataset.event;if(!p.events.includes(n)){S.selectedEvent=n;renderPuzzle()}return}if(b.dataset.eventSlot!==undefined){if(S.selectedEvent!==null)assignEvent(+b.dataset.eventSlot,S.selectedEvent);else if(p.events[+b.dataset.eventSlot]!==null){p.events[+b.dataset.eventSlot]=null;renderPuzzle()}return}}
 }};
function checkComplete(i){let x=t(),p=currentTemp();if(i===1&&p.matches.length===3)finishStage(i);else if(i===2&&p.levels.every(v=>v!==null)){if(p.levels.every((v,k)=>v===k)){finishStage(i)}else showStatus(x.wrong,true)}else if(i===3&&p.events.every(v=>v!==null)){if(p.events.every((v,k)=>v===k)){finishStage(i)}else showStatus(x.wrong,true)}}
function assignFood(a,b){if(S.active!==1)return;let p=currentTemp();if(p.matches.includes(a))return;if(a===b){p.matches.push(a);S.selectedFood=null;renderPuzzle();checkComplete(1);if(S.active===1&&S.completed===1)showStatus(t().good)}else showStatus(t().wrong,true)}
function assignLevel(slot,id){let p=currentTemp();p.levels=p.levels.map(v=>v===id?null:v);p.levels[slot]=id;S.selectedLevel=null;renderPuzzle();checkComplete(2)}
function assignEvent(slot,id){let p=currentTemp();p.events=p.events.map(v=>v===id?null:v);p.events[slot]=id;S.selectedEvent=null;renderPuzzle();checkComplete(3)}
function wireDragging(){document.querySelectorAll('[draggable=true]').forEach(e=>e.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',e.dataset.food!==undefined?'food:'+e.dataset.food:e.dataset.level!==undefined?'level:'+e.dataset.level:'event:'+e.dataset.event)}));document.querySelectorAll('[data-animal],[data-level-slot],[data-event-slot]').forEach(e=>{e.ondragover=ev=>ev.preventDefault();e.ondrop=ev=>{ev.preventDefault();let [type,id]=(ev.dataTransfer.getData('text/plain')||'').split(':');if(type==='food'&&e.dataset.animal!==undefined)assignFood(+id,+e.dataset.animal);if(type==='level'&&e.dataset.levelSlot!==undefined)assignLevel(+e.dataset.levelSlot,+id);if(type==='event'&&e.dataset.eventSlot!==undefined)assignEvent(+e.dataset.eventSlot,+id)}})}
function wirePath(){let b=el('pathBoard');if(!b)return;let pointerDown=false;function hit(ev){let stones=[...b.querySelectorAll('.stone')];let p=currentTemp();let next=stones[p.pathCount];if(!next)return;let r=next.getBoundingClientRect();let d=Math.hypot(ev.clientX-(r.left+r.width/2),ev.clientY-(r.top+r.height/2));if(d<Math.max(28,r.width*.72)){p.pathCount++;if(p.pathCount===5){finishStage(4);return}next.classList.add('hit');next.textContent='✓';b.querySelector('.small')?.remove();let small=b.nextElementSibling;if(small)small.textContent=`${t().pathFinish}: ${p.pathCount} ${t().of} 5`}}
 b.addEventListener('pointerdown',ev=>{pointerDown=true;hit(ev)});b.addEventListener('pointermove',ev=>{if(pointerDown)hit(ev)});window.addEventListener('pointerup',()=>{pointerDown=false});window.addEventListener('pointercancel',()=>{pointerDown=false});
 b.querySelectorAll('.stone').forEach(s=>s.onclick=(ev)=>{ev.stopPropagation();if(pointerDown)return;hit(ev)})}
function finishStage(i){S.completed=Math.max(S.completed,i+1);save();const x=t();el('puzzle').innerHTML=rewardHtml(i,false);setText('missionHead',x.rewards[i]);setText('missionIntro',x.rewardText[i]);
 el('progress').innerHTML=Array.from({length:5},(_,j)=>`<span class="${j<S.completed?'on':''}"></span>`).join('');
 el('markers').querySelectorAll('button').forEach((b,j)=>{b.disabled=j>S.completed;b.className=`marker ${j<S.completed?'done':j===S.completed?'current':''}`;b.textContent=j<S.completed?'✓':j>S.completed?'🔒':j+1});
 el('timeline').querySelectorAll('button').forEach((b,j)=>{b.disabled=j>S.completed;b.className=`${j<S.completed?'done':''} ${j===S.active?'active':''}`;b.querySelector('.stepno').textContent=j<S.completed?'✓':j+1});wireGeneral();}
function rewardHtml(i,replay){let x=t();return `<span class="info-pill">${x.source}：${x.sourceList[i]}</span><div class="reward"><div class="big-icon">${['🪢','🐑','🌊','🕊️','🌈'][i]}</div><h3>${i===4?x.finalTitle:x.rewards[i]}</h3><p>${i===4?x.finalText:x.rewardText[i]}</p></div>${i<4?`<div class="actions"><button class="btn" data-what="next">${x.next} ➜</button></div>`:''}`}
 el('zhBtn').onclick=()=>{S.lang='zh';save();updateAll()};el('enBtn').onclick=()=>{S.lang='en';save();updateAll()};el('resetBtn').onclick=()=>{if(confirm(t().resetConfirm)){S.completed=0;S.active=0;S.temp={};S.selectedFood=S.selectedLevel=S.selectedEvent=null;save();updateAll()}};
 updateAll();
</script></body></html>
